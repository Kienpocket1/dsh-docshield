name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docshield/package-lock.json
      - name: DocShield
        working-directory: docshield
        run: |
          npm ci
          npm test
      - name: Gate
        working-directory: gate
        run: npm test
